version: '3.8'

services:
  # llama.cpp server for vision-language inference
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      # Mount model files from host
      - /home/aiguru/models/Qwen3.5-9B:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen3.5-9B-UD-Q4_K_XL.gguf
      - LLAMA_ARG_MMPROJ=/models/mmproj-BF16.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_N_GPU_LAYERS=0
      - LLAMA_ARG_THREADS=-1
    command: >
      --model /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-BF16.gguf
      --port 8080
      --host 0.0.0.0
      -ngl 0
      --ctx-size 32768
      --threads -1
      --timeout 300
      -np 4
      --metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # FastAPI application
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///storage/db.sqlite
      - REDIS_URL=redis://redis:6379/0
      - LLAMA_SERVER_URL=http://llama-server:8080
      - STORAGE_PATH=/app/storage/uploads
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - redis
      - llama-server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker for async tasks
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///storage/db.sqlite
      - REDIS_URL=redis://redis:6379/0
      - LLAMA_SERVER_URL=http://llama-server:8080
      - STORAGE_PATH=/app/storage/uploads
    depends_on:
      - redis
      - llama-server
    command: celery -A celery_worker.celery_app worker -l info -c 2 -Q media,analysis,submission

  # Celery beat for scheduled tasks (optional)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///storage/db.sqlite
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A celery_worker.celery_app beat -l info

  # Redis message broker
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  redis_data:
