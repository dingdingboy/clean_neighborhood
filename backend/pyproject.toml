[project]
name = "violation-reporter"
version = "0.1.0"
description = "Public interest violation reporting application with AI analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "openvino>=2024.0.0",
    "optimum[openvino]>=1.16.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "websockets>=12.0",
    "aiofiles>=23.2.1",
    "python-magic>=0.4.27",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "celery_worker", "ai"]
package-dir = {"" = "."}

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
